name: Official release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build and release, for example v1.0.0
        required: true
        type: string
      publish:
        description: Create and publish the GitHub Release after all eight native smokes pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: minibase-official-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: [self-hosted, Windows, X64, minibase-benchmark]
    timeout-minutes: 90
    env:
      DENO_NO_UPDATE_CHECK: "1"
      MINIBASE_POSTGRES_RUNTIME_DIR: ${{ vars.MINIBASE_POSTGRES_RUNTIME_DIR }}
      TAG: ${{ inputs.tag }}
      DISPATCH_REF_NAME: ${{ github.ref_name }}
      DISPATCH_REF_TYPE: ${{ github.ref_type }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout tagged release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize Windows checkout
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "minibase-checkout-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.tar"
          git archive --format=tar --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git status --porcelain).Length -ne 0) {
            throw 'Normalized checkout must match the audited commit exactly.'
          }

      - name: Verify fixed runner and immutable dispatch
        shell: powershell
        run: |
          if ($env:DISPATCH_REF_TYPE -ne 'tag' -or $env:DISPATCH_REF_NAME -ne $env:TAG) {
            throw 'Official release must be dispatched from the exact tag supplied in the tag input.'
          }
          if ($env:TAG -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$') {
            throw 'Official release tag must be a stable v<major>.<minor>.<patch> tag.'
          }
          if ([string]::IsNullOrWhiteSpace($env:MINIBASE_POSTGRES_RUNTIME_DIR)) {
            throw 'MINIBASE_POSTGRES_RUNTIME_DIR repository variable is required.'
          }
          $postgres = Join-Path $env:MINIBASE_POSTGRES_RUNTIME_DIR 'bin\postgres.exe'
          if (-not (Test-Path -LiteralPath $postgres -PathType Leaf)) {
            throw "PostgreSQL 18.4 executable is missing: $postgres"
          }
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $listener = Join-Path $runnerRoot 'bin\Runner.Listener.exe'
          if (-not (Test-Path -LiteralPath $listener -PathType Leaf)) {
            throw "GitHub Actions Runner listener is missing: $listener"
          }
          $runnerVersion = (& $listener --version | Select-Object -First 1).Trim()
          if ($runnerVersion -ne '2.335.1') {
            throw "GitHub Actions Runner 2.335.1 is required; found $runnerVersion"
          }
          if ((deno --version | Select-Object -First 1) -notmatch '^deno 2\.9\.2 ') {
            throw 'Deno 2.9.2 is required.'
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne $env:GITHUB_SHA) {
            throw "Dispatch SHA $env:GITHUB_SHA does not match tagged commit $commit."
          }
          if ((git status --porcelain).Length -ne 0) {
            throw 'Official release checkout must be clean.'
          }

      - name: Run complete correctness and release gates
        shell: powershell
        run: |
          deno task fmt:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deno task lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deno task check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deno task test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deno task verify:baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deno task test:postgres
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deno task release:ready:check --tag $env:TAG --repository-visibility $env:REPOSITORY_VISIBILITY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export immutable release metadata
        id: metadata
        shell: powershell
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $version = (Get-Content -Raw -Encoding utf8 deno.json | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match deno.json version $version."
          }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  draft:
    name: Create protected draft Release
    if: ${{ inputs.publish }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      release_url: ${{ steps.create.outputs.release_url }}

    steps:
      - name: Refuse to replace an existing Release
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id')"
          test -z "$existing" || {
            echo "A GitHub Release already exists for $TAG; refusing to overwrite it." >&2
            exit 1
          }

      - name: Create draft Release before native builds
        id: create
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            --arg name "Minibase $TAG" \
            '{tag_name: $tag, target_commitish: $commit, name: $name, draft: true, prerelease: false, generate_release_notes: true}')"
          response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input - <<<"$payload")"
          release_id="$(jq -r '.id' <<<"$response")"
          release_url="$(jq -r '.html_url' <<<"$response")"
          test "$release_id" != "null"
          test "$release_url" != "null"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.edition }} ${{ matrix.platform }}
    if: ${{ always() && needs.preflight.result == 'success' && (inputs.publish == false || needs.draft.result == 'success') }}
    needs: [preflight, draft]
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            edition: embedded
            runner: '["self-hosted","Windows","X64","minibase-benchmark"]'
            expected_os: Windows
            expected_arch: X64
            deno_asset: deno-x86_64-pc-windows-msvc.zip
            deno_archive_bytes: 42721120
            deno_archive_sha256: 5fe194d26ac5ef77fcc5288c2c438c7a0465f3b6180440ebf04092714bf2dcdf
            deno_executable_sha256: a5270c2bb75a2ec12fef53185730327267d9e9fe6be6a962c5d1d5a050f93c88
          - platform: windows-x64
            edition: server
            runner: '["self-hosted","Windows","X64","minibase-benchmark"]'
            expected_os: Windows
            expected_arch: X64
            deno_asset: deno-x86_64-pc-windows-msvc.zip
            deno_archive_bytes: 42721120
            deno_archive_sha256: 5fe194d26ac5ef77fcc5288c2c438c7a0465f3b6180440ebf04092714bf2dcdf
            deno_executable_sha256: a5270c2bb75a2ec12fef53185730327267d9e9fe6be6a962c5d1d5a050f93c88
          - platform: linux-x64
            edition: embedded
            runner: '["ubuntu-24.04"]'
            expected_os: Linux
            expected_arch: x86_64
            deno_asset: deno-x86_64-unknown-linux-gnu.zip
            deno_archive_bytes: 43926976
            deno_archive_sha256: 934d1bd5cb09eaed7f2e4a4fc58208d04a3c5c0fcde9f319d93d735265c67a4a
            deno_executable_sha256: 5bc8a7a4a628360b391ddeac2efac7dec9e670b33156d831bf1e899070655173
          - platform: linux-x64
            edition: server
            runner: '["ubuntu-24.04"]'
            expected_os: Linux
            expected_arch: x86_64
            deno_asset: deno-x86_64-unknown-linux-gnu.zip
            deno_archive_bytes: 43926976
            deno_archive_sha256: 934d1bd5cb09eaed7f2e4a4fc58208d04a3c5c0fcde9f319d93d735265c67a4a
            deno_executable_sha256: 5bc8a7a4a628360b391ddeac2efac7dec9e670b33156d831bf1e899070655173
          - platform: macos-x64
            edition: embedded
            runner: '["macos-15-intel"]'
            expected_os: Darwin
            expected_arch: x86_64
            deno_asset: deno-x86_64-apple-darwin.zip
            deno_archive_bytes: 42336919
            deno_archive_sha256: c953379e5a85a0a30e99aa51b807633e380e809a1181f53e4904d5fa73785bff
            deno_executable_sha256: 201651c6e72bd0df2dbe994b4f8ca0f935631e08c27290a3a92342e02ad0e865
          - platform: macos-x64
            edition: server
            runner: '["macos-15-intel"]'
            expected_os: Darwin
            expected_arch: x86_64
            deno_asset: deno-x86_64-apple-darwin.zip
            deno_archive_bytes: 42336919
            deno_archive_sha256: c953379e5a85a0a30e99aa51b807633e380e809a1181f53e4904d5fa73785bff
            deno_executable_sha256: 201651c6e72bd0df2dbe994b4f8ca0f935631e08c27290a3a92342e02ad0e865
          - platform: macos-arm64
            edition: embedded
            runner: '["macos-15"]'
            expected_os: Darwin
            expected_arch: arm64
            deno_asset: deno-aarch64-apple-darwin.zip
            deno_archive_bytes: 37981362
            deno_archive_sha256: 687ae485168ba73a4f1ee3a954eb4f077eca82f2fefd236a6a83a3889287876c
            deno_executable_sha256: 218ab752ae8f64f0a7822af710886488f15169fdae153a3aada4861f9635b266
          - platform: macos-arm64
            edition: server
            runner: '["macos-15"]'
            expected_os: Darwin
            expected_arch: arm64
            deno_asset: deno-aarch64-apple-darwin.zip
            deno_archive_bytes: 37981362
            deno_archive_sha256: 687ae485168ba73a4f1ee3a954eb4f077eca82f2fefd236a6a83a3889287876c
            deno_executable_sha256: 218ab752ae8f64f0a7822af710886488f15169fdae153a3aada4861f9635b266
    env:
      DENO_NO_UPDATE_CHECK: "1"
      DENO_VERSION: "2.9.2"
      VERSION: ${{ needs.preflight.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      EDITION: ${{ matrix.edition }}

    steps:
      - name: Checkout tagged release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Install fixed Deno Runtime on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        env:
          DENO_ASSET: ${{ matrix.deno_asset }}
          DENO_ARCHIVE_BYTES: ${{ matrix.deno_archive_bytes }}
          DENO_ARCHIVE_SHA256: ${{ matrix.deno_archive_sha256 }}
          DENO_EXECUTABLE_SHA256: ${{ matrix.deno_executable_sha256 }}
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "deno-$env:DENO_VERSION-$env:GITHUB_JOB-$env:PLATFORM-$env:EDITION"
          $archive = Join-Path $env:RUNNER_TEMP $env:DENO_ASSET
          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/download/v$env:DENO_VERSION/$env:DENO_ASSET" `
            -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne [int64]$env:DENO_ARCHIVE_BYTES) {
            throw 'Deno archive size mismatch.'
          }
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:DENO_ARCHIVE_SHA256) {
            throw "Deno archive SHA-256 mismatch: $archiveHash"
          }
          if (Test-Path -LiteralPath $runtimeDir) {
            Remove-Item -LiteralPath $runtimeDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeDir
          $deno = Join-Path $runtimeDir 'deno.exe'
          $executableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $deno).Hash.ToLowerInvariant()
          if ($executableHash -ne $env:DENO_EXECUTABLE_SHA256) {
            throw "Deno executable SHA-256 mismatch: $executableHash"
          }
          $runtimeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install fixed Deno Runtime on Unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          DENO_ASSET: ${{ matrix.deno_asset }}
          DENO_ARCHIVE_BYTES: ${{ matrix.deno_archive_bytes }}
          DENO_ARCHIVE_SHA256: ${{ matrix.deno_archive_sha256 }}
          DENO_EXECUTABLE_SHA256: ${{ matrix.deno_executable_sha256 }}
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/deno-$DENO_VERSION-$GITHUB_JOB-$PLATFORM-$EDITION"
          archive="$RUNNER_TEMP/$DENO_ASSET"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/$DENO_ASSET"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$DENO_ARCHIVE_BYTES"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "$DENO_ARCHIVE_SHA256  $archive" | shasum -a 256 --check
          else
            echo "$DENO_ARCHIVE_SHA256  $archive" | sha256sum --check
          fi
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          unzip -q "$archive" -d "$runtime_dir"
          chmod 0755 "$runtime_dir/deno"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "$DENO_EXECUTABLE_SHA256  $runtime_dir/deno" | shasum -a 256 --check
          else
            echo "$DENO_EXECUTABLE_SHA256  $runtime_dir/deno" | sha256sum --check
          fi
          echo "$runtime_dir" >> "$GITHUB_PATH"

      - name: Verify Windows release host
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        env:
          DENO_EXECUTABLE_SHA256: ${{ matrix.deno_executable_sha256 }}
          MINIBASE_POSTGRES_RUNTIME_DIR: ${{ vars.MINIBASE_POSTGRES_RUNTIME_DIR }}
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Expected Windows/X64, found $env:RUNNER_OS/$env:RUNNER_ARCH."
          }
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $listener = Join-Path $runnerRoot 'bin\Runner.Listener.exe'
          $runnerVersion = (& $listener --version | Select-Object -First 1).Trim()
          if ($runnerVersion -ne '2.335.1') {
            throw "GitHub Actions Runner 2.335.1 is required; found $runnerVersion"
          }
          if ((deno --version | Select-Object -First 1) -notmatch '^deno 2\.9\.2 ') {
            throw 'Deno 2.9.2 is required.'
          }
          $denoHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Get-Command deno).Source).Hash.ToLowerInvariant()
          if ($denoHash -ne $env:DENO_EXECUTABLE_SHA256) {
            throw "Deno executable SHA-256 mismatch: $denoHash"
          }
          if ($env:EDITION -eq 'server') {
            if ([string]::IsNullOrWhiteSpace($env:MINIBASE_POSTGRES_RUNTIME_DIR)) {
              throw 'MINIBASE_POSTGRES_RUNTIME_DIR repository variable is required for Windows Server.'
            }
            $postgres = Join-Path $env:MINIBASE_POSTGRES_RUNTIME_DIR 'bin\postgres.exe'
            if (-not (Test-Path -LiteralPath $postgres -PathType Leaf)) {
              throw "PostgreSQL 18.4 executable is missing: $postgres"
            }
          }
          if ((git rev-parse HEAD).Trim() -ne '${{ needs.preflight.outputs.commit }}') {
            throw 'Release matrix checkout does not match the preflight commit.'
          }
          if ((git status --porcelain).Length -ne 0) {
            throw 'Release matrix checkout must be clean.'
          }
          deno install --frozen=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Unix release host
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          DENO_EXECUTABLE_SHA256: ${{ matrix.deno_executable_sha256 }}
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = "$EXPECTED_OS"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test "$(deno --version | head -n 1 | cut -d' ' -f1-2)" = "deno $DENO_VERSION"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "$DENO_EXECUTABLE_SHA256  $(command -v deno)" | shasum -a 256 --check
          else
            echo "$DENO_EXECUTABLE_SHA256  $(command -v deno)" | sha256sum --check
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"
          deno install --frozen=true

      - name: Restore fixed PostgreSQL source cache
        if: ${{ matrix.edition == 'server' && runner.os != 'Windows' }}
        id: postgres-cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: ${{ runner.temp }}/minibase-release-cache
          key: postgres-18.4-${{ matrix.platform }}-source-v1

      - name: Prepare fixed PostgreSQL Runtime inputs
        if: ${{ matrix.edition == 'server' && runner.os != 'Windows' }}
        shell: bash
        env:
          MINIBASE_RELEASE_CACHE_DIR: ${{ runner.temp }}/minibase-release-cache
        run: |
          set -euo pipefail
          deno task "release:prepare:postgres:$PLATFORM"

      - name: Build and smoke Windows release
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        env:
          MINIBASE_POSTGRES_RUNTIME_DIR: ${{ vars.MINIBASE_POSTGRES_RUNTIME_DIR }}
        run: |
          New-Item -ItemType Directory -Force -Path '.evidence/local' | Out-Null
          deno task "release:smoke:${env:EDITION}:${env:PLATFORM}" `
            | Tee-Object -FilePath ".evidence/local/${env:EDITION}-${env:PLATFORM}-smoke.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and smoke Unix release
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          MINIBASE_RELEASE_CACHE_DIR: ${{ runner.temp }}/minibase-release-cache
        run: |
          set -euo pipefail
          mkdir -p .evidence/local
          deno task "release:smoke:$EDITION:$PLATFORM" \
            | tee ".evidence/local/$EDITION-$PLATFORM-smoke.jsonl"

      - name: Save fixed PostgreSQL source cache
        if: ${{ success() && matrix.edition == 'server' && runner.os != 'Windows' && steps.postgres-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: ${{ runner.temp }}/minibase-release-cache
          key: postgres-18.4-${{ matrix.platform }}-source-v1

      - name: Package Windows release
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $source = "dist/$env:PLATFORM/$env:EDITION"
          if (Test-Path -LiteralPath 'LICENSE' -PathType Leaf) {
            Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $source 'LICENSE')
          }
          Copy-Item -LiteralPath 'docs/COMPATIBILITY.md' -Destination (Join-Path $source 'COMPATIBILITY.md')
          New-Item -ItemType Directory -Force -Path 'release-packages' | Out-Null
          $name = "minibase-$env:EDITION-$env:PLATFORM-v$env:VERSION.zip"
          $archive = Join-Path 'release-packages' $name
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            $artifact = "minibase-$env:EDITION-$env:PLATFORM.exe"
            $required = @(
              $artifact,
              "$artifact.sha256",
              'release-manifest.json',
              'THIRD_PARTY_LICENSES.txt',
              'COMPATIBILITY.md'
            )
            if (Test-Path -LiteralPath (Join-Path $source 'LICENSE') -PathType Leaf) {
              $required += 'LICENSE'
            }
            foreach ($entry in $required) {
              if ($entries -notcontains $entry) { throw "Release archive is missing $entry." }
            }
          } finally {
            $zip.Dispose()
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $name" | Out-File -FilePath "$archive.sha256" -Encoding ascii

      - name: Package Unix release
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          source="dist/$PLATFORM/$EDITION"
          if [[ -f LICENSE ]]; then
            cp LICENSE "$source/LICENSE"
          fi
          cp docs/COMPATIBILITY.md "$source/COMPATIBILITY.md"
          mkdir -p release-packages
          name="minibase-$EDITION-$PLATFORM-v$VERSION.tar.gz"
          archive="release-packages/$name"
          tar -C "$source" -czf "$archive" .
          artifact="minibase-$EDITION-$PLATFORM"
          entries="$(tar -tzf "$archive" | sed 's#^\./##')"
          required=( \
            "$artifact" \
            "$artifact.sha256" \
            release-manifest.json \
            THIRD_PARTY_LICENSES.txt \
            COMPATIBILITY.md
          )
          if [[ -f "$source/LICENSE" ]]; then
            required+=(LICENSE)
          fi
          for required in "${required[@]}"; do
            grep -Fxq "$required" <<<"$entries"
          done
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            hash="$(shasum -a 256 "$archive" | awk '{print $1}')"
          else
            hash="$(sha256sum "$archive" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$hash" "$name" > "$archive.sha256"

      - name: Upload package as workflow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-${{ matrix.edition }}-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-packages
            .evidence/local/${{ matrix.edition }}-${{ matrix.platform }}-smoke.jsonl
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish:
    name: Verify draft assets and publish
    if: ${{ inputs.publish && always() && needs.preflight.result == 'success' && needs.draft.result == 'success' && needs.build.result == 'success' }}
    needs: [preflight, draft, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Recover and verify the exact eight native packages
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "minibase-embedded-windows-x64-v$VERSION.zip"
            "minibase-server-windows-x64-v$VERSION.zip"
            "minibase-embedded-linux-x64-v$VERSION.tar.gz"
            "minibase-server-linux-x64-v$VERSION.tar.gz"
            "minibase-embedded-macos-x64-v$VERSION.tar.gz"
            "minibase-server-macos-x64-v$VERSION.tar.gz"
            "minibase-embedded-macos-arm64-v$VERSION.tar.gz"
            "minibase-server-macos-arm64-v$VERSION.tar.gz"
          )
          artifacts=(
            "release-embedded-windows-x64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
            "release-server-windows-x64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
            "release-embedded-linux-x64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
            "release-server-linux-x64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
            "release-embedded-macos-x64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
            "release-server-macos-x64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
            "release-embedded-macos-arm64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
            "release-server-macos-arm64-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
          )
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            '.draft == true and .tag_name == $tag and .target_commitish == $commit' \
            <<<"$release" >/dev/null
          test "$(jq '.assets | length' <<<"$release")" -eq 0
          artifact_index="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          mkdir -p workflow-artifacts release-packages
          for index in "${!artifacts[@]}"; do
            artifact_name="${artifacts[$index]}"
            package_name="${packages[$index]}"
            artifact_id="$(jq -r --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else empty end' \
              <<<"$artifact_index")"
            test -n "$artifact_id"
            artifact_zip="workflow-artifacts/$artifact_name.zip"
            artifact_dir="workflow-artifacts/$artifact_name"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$artifact_zip"
            mkdir -p "$artifact_dir"
            unzip -q "$artifact_zip" -d "$artifact_dir"
            package_path="$artifact_dir/release-packages/$package_name"
            checksum_path="$package_path.sha256"
            test -f "$package_path"
            test -f "$checksum_path"
            (cd "$(dirname "$package_path")" && sha256sum -c "$(basename "$checksum_path")")
            cp "$package_path" "release-packages/$package_name"
          done
          test "$(find release-packages -maxdepth 1 -type f | wc -l)" -eq 8
          for archive in release-packages/*.zip; do
            unzip -t "$archive" >/dev/null
          done
          for archive in release-packages/*.tar.gz; do
            tar -tzf "$archive" >/dev/null
          done

      - name: Upload packages to the protected draft
        shell: bash
        run: |
          set -euo pipefail
          for package in release-packages/*; do
            gh release upload "$TAG" "$package" --repo "$GITHUB_REPOSITORY"
          done

      - name: Download and verify draft assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "minibase-embedded-windows-x64-v$VERSION.zip"
            "minibase-server-windows-x64-v$VERSION.zip"
            "minibase-embedded-linux-x64-v$VERSION.tar.gz"
            "minibase-server-linux-x64-v$VERSION.tar.gz"
            "minibase-embedded-macos-x64-v$VERSION.tar.gz"
            "minibase-server-macos-x64-v$VERSION.tar.gz"
            "minibase-embedded-macos-arm64-v$VERSION.tar.gz"
            "minibase-server-macos-arm64-v$VERSION.tar.gz"
          )
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release" | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 8
          diff -u <(printf '%s\n' "${sorted_expected[@]}") <(printf '%s\n' "${actual[@]}")
          mkdir -p release-verification
          for name in "${expected[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir release-verification
          done
          for archive in release-verification/*.zip; do
            unzip -t "$archive" >/dev/null
          done
          for archive in release-verification/*.tar.gz; do
            tar -tzf "$archive" >/dev/null
          done
          (
            cd release-verification
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Upload checksum manifest and verify final asset set
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-verification/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq '.assets | length' <<<"$release")" -eq 9
          test "$(jq -r '[.assets[].name | select(. == "SHA256SUMS.txt")] | length' <<<"$release")" -eq 1

      - name: Publish only after every verification succeeds
        shell: bash
        run: |
          set -euo pipefail
          published="$(gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false)"
          jq -e \
            --arg tag "$TAG" \
            '.draft == false and .tag_name == $tag and (.assets | length) == 9' \
            <<<"$published" >/dev/null
